<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nguyễn Ngọc Nam Anh">
  <!--
    The tab icon, redrawn from the studio's mark. Next.js picks this up from its
    filename alone; the rules are in
    node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/01-metadata/app-icons.md

    A rounded square with an eye cut through it and two blades sheared off the top
    left and bottom right corners, so the whole thing turns like a shutter. Built
    as a mask rather than as outlines: the square, the eye and the two blades are
    all subtractions from one black field, which is what keeps the white of the
    eye and the white of the blades reading as the same cut. Draw them as separate
    filled shapes instead and every seam between them has to be kept in register
    by hand.

    Everything that touches the silhouette is deliberately made to overshoot it.
    The eye's tips sit at x 40 and 472, outside the square's 58 and 454, so the
    eye severs the left and right sides outright; both blades start and end well
    past the edge they cross. An earlier version had the tips land exactly on the
    edge and the blades stop just short of it, and both went wrong in the same
    way: a shape that ends near a boundary leaves a rounded cap or a knife point
    embedded in the outline, which reads as a dent in the square rather than as a
    cut through it. Nothing here should terminate anywhere it can be seen.

    That overshoot costs room, and the left edge is where it runs out. Between the
    corner arc at y 142 and the eye's upper lid at y 239 there is 97 to hold a 34
    blade and a band of black on either side of it. That is the tightest fit in
    the file: widen the blade, drop the corner radius, or make the eye taller, and
    one of those two bands closes up.

    Checked at 512, 64, 32 and 16 rather than assumed. The pupil's highlight is the
    first thing to go; by 16px the mark carries on silhouette alone, which it can
    because the silhouette is a square with two bites out of it.

    The white ground is deliberate, not padding. The artwork is pure black and a
    tab strip in a dark theme would swallow it if this were transparent.
  -->
  <rect width="512" height="512" fill="#fff"/>
  <mask id="cuts">
    <rect width="512" height="512" fill="#000"/>
    <rect x="58" y="58" width="396" height="396" rx="84" fill="#fff"/>
    <path d="M 40 256 Q 256 48 472 256 Q 256 464 40 256 Z" fill="#000"/>
    <path fill="none" stroke="#000" stroke-width="34" stroke-linecap="round"
          d="M 6 236 Q 120 110 372 -4"/>
    <path fill="none" stroke="#000" stroke-width="34" stroke-linecap="round"
          d="M 506 276 Q 392 402 140 516"/>
  </mask>
  <rect width="512" height="512" fill="#000" mask="url(#cuts)"/>
  <circle cx="256" cy="256" r="56" fill="#000"/>
  <circle cx="234" cy="234" r="20" fill="#fff"/>
</svg>
