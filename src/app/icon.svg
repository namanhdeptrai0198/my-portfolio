<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nguyễn Ngọc Nam Anh">
  <!--
    The tab icon. Next.js picks this up from its filename alone; the rules are in
    node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/01-metadata/app-icons.md

    The brief: one hand, five digits, two of them closed into a ring around an
    eye — the ring being the lens. So three fingers stand, and the index comes
    over the top to meet the thumb underneath, which is the OK sign and is also
    the only arrangement of a real hand that makes that ring.

    The ring is the part that has to be built to a rule. Every stroke that forms
    it keeps its INNER edge on the same radius, 59: the loop is r 78 with a 38
    band, the thumb r 82 with a 46 band, and the index rides outside r 78 for its
    whole length. Break that by a few units and the thicker stroke drives a black
    wedge into the opening, right beside the eye. Only the outside is allowed to
    step, and those steps are what read as separate digits.

    The eye is one path with fill-rule="evenodd", the second contour cutting the
    opening out of the first, with the pupil drawn separately. Its outline is the
    first thing to go as the icon shrinks: at 32px it still reads, at 16px it
    fills in and the mark carries on the hand and ring alone. Checked at 256, 64,
    32 and 16 rather than assumed.

    The white ground is deliberate, not padding. The artwork is pure black, and a
    tab strip in a dark theme would swallow it if this were transparent.
  -->
  <rect width="512" height="512" fill="#fff"/>
  <g transform="translate(256 256) scale(1.22) translate(-310 -291)" fill="#000">
    <path d="M 145 250 L 145 440 Q 145 470 175 470 L 275 470 Q 305 470 305 440 L 305 250 Z"/>
    <path fill="none" stroke="#000" stroke-width="36" stroke-linecap="round" d="M 170 284 C 167 248, 167 220, 169 200"/>
    <path fill="none" stroke="#000" stroke-width="38" stroke-linecap="round" d="M 222 284 C 219 240, 219 194, 222 166"/>
    <path fill="none" stroke="#000" stroke-width="40" stroke-linecap="round" d="M 274 284 C 271 230, 272 176, 276 138"/>
    <circle cx="378" cy="306" r="78" fill="none" stroke="#000" stroke-width="38"/>
    <path fill="none" stroke="#000" stroke-width="38" stroke-linecap="round"
          d="M 296 262 C 300 220, 334 194, 378 198 C 422 202, 454 232, 457 276"/>
    <path fill="none" stroke="#000" stroke-width="46" stroke-linecap="round"
          d="M 307 347 A 82 82 0 0 0 445.2 353"/>
    <path fill-rule="evenodd" d="
      M 334 306 C 356 270, 400 270, 422 306 C 400 342, 356 342, 334 306 Z
      M 348 306 C 365 284, 391 284, 408 306 C 391 328, 365 328, 348 306 Z"/>
    <circle cx="378" cy="306" r="14"/>
  </g>
</svg>
