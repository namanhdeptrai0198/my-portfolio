<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nguyễn Ngọc Nam Anh">
  <!--
    The tab icon. Next.js picks this up from its filename alone; the rules are in
    node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/01-metadata/app-icons.md

    Redrawn from the mark rather than copied from the favicon set that came with
    it: that version was traced in pieces, and the seams showed. A white line ran
    across the palm where the finger strokes stopped, the short finger left a gap
    at its base, and the ring floated clear of the hand instead of growing out of
    it. Here the palm is one filled path and the fingers are round-capped strokes
    laid over it, so black meets black and there is nothing to seam; the ring's
    band is drawn wide enough to reach back into the palm and merge with it.

    The eye is an almond drawn as one path with fill-rule="evenodd", so the
    second contour cuts the opening out of the first, plus a separate pupil. Its
    outline is the first thing to go as the icon shrinks: at 32px it still reads,
    at 16px it fills in and the mark survives on the hand and ring alone. That is
    the mark's own limit, not the file's.

    The white ground is deliberate and not padding. The artwork is pure black,
    and a tab strip in a dark theme would swallow it if this were transparent.
  -->
  <rect width="512" height="512" fill="#fff"/>
  <g transform="translate(256 256) scale(1.24) translate(-311 -276)" fill="#000">
    <path d="M 178 236 L 178 424 Q 178 452 206 452 L 244 452 Q 272 452 272 424 L 272 236 Z"/>
    <path fill="none" stroke="#000" stroke-width="38" stroke-linecap="round" d="M 199 262 C 196 220, 196 186, 198 162"/>
    <path fill="none" stroke="#000" stroke-width="42" stroke-linecap="round" d="M 251 262 C 248 202, 249 150, 254 116"/>
    <circle cx="345" cy="265" r="80" fill="none" stroke="#000" stroke-width="38"/>
    <path fill-rule="evenodd" d="
      M 299 265 C 322 227, 368 227, 391 265 C 368 303, 322 303, 299 265 Z
      M 313 265 C 331 242, 359 242, 377 265 C 359 288, 331 288, 313 265 Z"/>
    <circle cx="345" cy="265" r="15"/>
  </g>
</svg>
